name: Build and Package WordPress Plugin

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build:
    name: Build Plugin Zip
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required for creating GitHub Releases

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Extract plugin slug from the repository name
      - name: Get Plugin Slug
        id: slug
        run: echo "slug=${{ github.event.repository.name }}" >> $GITHUB_ENV

      # 3. Optional: Install PHP dependencies if composer.json exists
      - name: Install Composer Dependencies
        if: hashFiles('composer.json') != ''
        run: composer install --no-dev --optimize-autoloader

      # 4. Optional: Build JS/CSS assets if package.json exists
      - name: Build Node Assets
        if: hashFiles('package.json') != ''
        run: |
          npm install
          npm run build

      # 5. Prepare build directory and filter out dev/junk files using rsync
      - name: Prepare Build Directory
        run: |
          mkdir -p build/${{ env.slug }}
          rsync -av --progress ./ build/${{ env.slug }}/ \
            --exclude='build/' \
            --exclude='.git*' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='composer.lock' \
            --exclude='package-lock.json' \
            --exclude='gulpfile.js' \
            --exclude='README.md'

      # 6. Create a clean physical .zip file (used for GitHub Releases)
      - name: Create Zip Archive
        run: |
          cd build
          zip -r ../${{ env.slug }}.zip ${{ env.slug }}
          cd ..

      # 7. Upload the folder directly as an artifact (artifact name is now just the slug)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.slug }}
          path: build/${{ env.slug }}
          retention-days: 30

      # 8. Automatically create a GitHub Release and attach the zip when a tag (e.g., v1.0.0) is pushed
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.slug }}.zip
